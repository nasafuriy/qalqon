name: Fixture — deliberately unsafe
on:
  pull_request_target:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Greet the contributor
        run: echo "Thanks ${{ github.event.pull_request.title }}"
