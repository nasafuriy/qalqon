services:
  db:
    image: postgres:16.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    cap_drop:
      - ALL
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 3s
      retries: 5

  cache:
    image: redis:7.2.4-alpine
