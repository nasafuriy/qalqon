# Apache httpd configuration.

id: apache-directory-listing
info:
  name: Directory listing enabled
  severity: medium
  description: >-
    Options Indexes makes Apache render a file listing when no index page
    exists. Listings routinely expose backups, dumps and configuration that
    nobody intended to publish.
  remediation: 'Use "Options -Indexes", and set it at the server level so vhosts inherit it.'
  tags: [apache, httpd, disclosure]
files:
  - httpd.conf
  - apache2.conf
  - "*.htaccess"
  - .htaccess
  - sites-available/*
  - sites-enabled/*
  - conf.d/*.conf
matchers:
  - type: regex
    comment: a leading minus disables it, so require a plus or a bare word
      after Options
    patterns:
      - '(?im)^\s*Options\s+[^\n-]*\bIndexes\b'
fix:
  op: replace
  find: '(?im)^([ \t]*Options[ \t]+(?:\S+[ \t]*)*?)\+?Indexes\b'
  replace: '${1}-Indexes'

---

id: apache-server-tokens-verbose
info:
  name: Apache advertises its version
  severity: low
  description: >-
    The default ServerTokens setting puts the httpd version, and often the
    module versions, into every response and error page.
  remediation: 'Set "ServerTokens Prod" and "ServerSignature Off".'
  tags: [apache, httpd, disclosure]
files:
  - httpd.conf
  - apache2.conf
  - conf.d/*.conf
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*ServerTokens\s+(?:Full|OS|Minor|Minimal|Major)\b'
fix:
  op: replace
  find: '(?im)^([ \t]*ServerTokens\s+)(?:Full|OS|Minor|Minimal|Major)\b[^\n]*$'
  replace: '${1}Prod'

---

id: apache-server-signature-on
info:
  name: Apache signature shown in error pages
  severity: low
  description: >-
    ServerSignature On adds a footer with the httpd version to every generated
    page, which is the same free version disclosure that ServerTokens Prod is
    written to remove.
  remediation: 'Set "ServerSignature Off".'
  tags: [apache, httpd, disclosure]
files:
  - httpd.conf
  - apache2.conf
  - conf.d/*.conf
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*ServerSignature\s+On\b'
fix:
  op: replace
  find: '(?im)^([ \t]*ServerSignature\s+)On\b[^\n]*$'
  replace: '${1}Off'

---

id: apache-weak-ssl-protocols
info:
  name: Obsolete TLS versions enabled
  severity: high
  description: >-
    SSLv2, SSLv3, TLS 1.0 and TLS 1.1 carry known protocol weaknesses and are
    already refused by current browsers.
  remediation: 'Use "SSLProtocol -all +TLSv1.2 +TLSv1.3".'
  reference:
    - https://ssl-config.mozilla.org/
  tags: [apache, httpd, tls, crypto]
files:
  - httpd.conf
  - apache2.conf
  - ssl.conf
  - sites-available/*
  - sites-enabled/*
  - conf.d/*.conf
matchers:
  - type: regex
    comment: only flag versions being switched on, not ones being removed
    patterns:
      - '(?im)^\s*SSLProtocol[^\n]*\+\s*(?:SSLv[23]|TLSv1\.1|TLSv1[^.\d])'
      - '(?im)^\s*SSLProtocol\s+all\s*$'
fix:
  op: replace
  find: '(?im)^([ \t]*)SSLProtocol\b[^\n]*$'
  replace: '${1}SSLProtocol -all +TLSv1.2 +TLSv1.3'

---

id: apache-trace-method
info:
  name: TRACE method left enabled
  severity: low
  description: >-
    TRACE echoes the request back, including headers. It has no legitimate use
    in production and has historically been chained into credential theft.
  remediation: 'Set "TraceEnable Off".'
  tags: [apache, httpd, hardening]
files:
  - httpd.conf
  - apache2.conf
  - conf.d/*.conf
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*TraceEnable\s+On\b'
fix:
  op: replace
  find: '(?im)^([ \t]*)TraceEnable\s+On\b[^\n]*$'
  replace: '${1}TraceEnable Off'

---

id: apache-allow-override-all
info:
  name: AllowOverride All delegates configuration to .htaccess
  severity: low
  description: >-
    AllowOverride All lets anyone who can write into the document root change
    server behaviour through .htaccess, and costs a filesystem check on every
    request in every parent directory.
  remediation: 'Use "AllowOverride None" and move the rules into the main configuration.'
  tags: [apache, httpd, hardening, performance]
files:
  - httpd.conf
  - apache2.conf
  - sites-available/*
  - sites-enabled/*
  - conf.d/*.conf
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*AllowOverride\s+All\b'
fix:
  op: replace
  find: '(?im)^([ \t]*AllowOverride\s+)All\b[^\n]*$'
  replace: '${1}None'

---

id: apache-weak-ssl-ciphers
info:
  name: Obsolete cipher suites enabled
  severity: high
  description: >-
    RC4, single DES, the export grades, MD5 and the anonymous suites are
    broken well past the point of academic interest. Offering them gives an
    attacker a weaker connection to negotiate down to.
  remediation: >-
    Use the Mozilla intermediate list, or at minimum append
    "!aNULL:!MD5:!DES:!RC4:!EXPORT" to SSLCipherSuite.
  reference:
    - https://ssl-config.mozilla.org/
  tags: [apache, httpd, tls, crypto]
files:
  - httpd.conf
  - apache2.conf
  - ssl.conf
  - sites-available/*
  - sites-enabled/*
  - conf.d/*.conf
matchers:
  - type: regex
    comment: '"!RC4" disables the suite, so require a separator that is not an exclamation mark'
    patterns:
      - '(?im)^\s*SSLCipherSuite[^\n]*[:\s"](?:RC4|DES-CBC3|EXPORT|aNULL|eNULL|ADH|MD5)\b'

---

id: apache-missing-hsts
info:
  name: TLS virtual host does not send HSTS
  severity: medium
  description: >-
    Without Strict-Transport-Security a browser that has only ever seen the
    site over HTTPS will still try plain HTTP on the next visit, which leaves
    room for an active network attacker to strip TLS.
  remediation: 'Add: Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"'
  reference:
    - https://developer.mozilla.org/docs/Web/HTTP/Headers/Strict-Transport-Security
  tags: [apache, httpd, tls, headers]
files:
  - httpd.conf
  - apache2.conf
  - ssl.conf
  - sites-available/*
  - sites-enabled/*
  - conf.d/*.conf
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?im)^\s*SSLEngine\s+on\b'
  - type: absent
    patterns:
      - '(?i)Strict-Transport-Security'
fix:
  op: insert-after
  find: '(?im)^[ \t]*SSLEngine[ \t]+on\b'
  replace: 'Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"'

---

id: apache-server-status-exposed
info:
  name: mod_status published without an access restriction
  severity: medium
  description: >-
    /server-status lists the current requests with their full URLs, the client
    addresses and the vhosts serving them. Left open it is a live feed of who
    is doing what, and it frequently leaks session tokens carried in query
    strings.
  remediation: 'Add a "Require ip" or "Require local" line inside the Location block, or disable mod_status.'
  reference:
    - https://httpd.apache.org/docs/current/mod/mod_status.html
  tags: [apache, httpd, exposure]
files:
  - httpd.conf
  - apache2.conf
  - ssl.conf
  - sites-available/*
  - sites-enabled/*
  - conf.d/*.conf
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?im)^\s*<Location\s+/server-status\s*>'
  - type: absent
    comment: any Require anywhere in the file stands the rule down rather than guess at scope
    patterns:
      - '(?im)^\s*Require\s+\S+'
