server {
    listen 443 ssl;
    server_name example.com;

    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers HIGH:MEDIUM:RC4:!aNULL;
    ssl_certificate     /etc/ssl/example.crt;
    ssl_certificate_key /etc/ssl/example.key;

    location /files/ {
        autoindex on;
    }

    location / {
        proxy_pass http://app:3000;
    }
}
