ServerTokens Full
ServerSignature On
TraceEnable On

<Directory /var/www>
    Options Indexes FollowSymLinks
    AllowOverride All
</Directory>

<Location /server-status>
    SetHandler server-status
</Location>

<VirtualHost *:443>
    SSLEngine on
    SSLProtocol all
    SSLCipherSuite HIGH:MEDIUM:RC4:!aNULL
</VirtualHost>
