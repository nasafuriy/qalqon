admin:
  address:
    socket_address:
      address: 127.0.0.1
      port_value: 9901

static_resources:
  clusters:
    - name: app
      transport_socket:
        typed_config:
          common_tls_context:
            tls_params:
              tls_minimum_protocol_version: TLSv1_2
            validation_context:
              trusted_ca:
                filename: /etc/ssl/internal-ca.pem
