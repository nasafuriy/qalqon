name: Release

# Pushing a tag like v0.1.0 builds binaries for every supported platform and
# publishes them on a GitHub Release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'

      - name: Test before publishing anything
        run: go test ./...

      - name: Build every platform
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          targets="linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64"

          for target in $targets; do
            os="${target%/*}"
            arch="${target#*/}"
            name="qalqon_${TAG}_${os}_${arch}"
            out="dist/$name"

            binary="qalqon"
            if [ "$os" = "windows" ]; then binary="qalqon.exe"; fi

            echo "building $name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "build/$binary" ./cmd/qalqon

            if [ "$os" = "windows" ]; then
              (cd build && zip -q "../${out}.zip" "$binary")
            else
              tar -czf "${out}.tar.gz" -C build "$binary"
            fi
            rm -rf build
          done

          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<EOF
          ## Qalqon $TAG

          One binary, no configuration. It looks at your configurations, your
          machine, your pipeline and your dependencies:

          | Command | Looks for |
          |---|---|
          | \`qalqon scan .\` | insecure Docker, Compose, Kubernetes, Helm, Terraform, CloudFormation, Ansible, GitHub Actions, GitLab CI, nginx, Apache, Caddy, Traefik, HAProxy, Envoy, sshd, systemd, PHP, PostgreSQL, MySQL, MongoDB and Redis configuration — and committed credentials |
          | \`qalqon host\` | the defence settings of the machine this binary runs on — Defender, firewall, RDP and SMB versions, service paths, autorun entries — strictly read-only |
          | \`qalqon report . -framework cis-docker\` | the same scan scored as a checklist against a framework embedded in the binary |
          | \`qalqon deps .\` | known vulnerabilities in the versions your manifests pin, via [osv.dev](https://osv.dev) |
          | \`qalqon history .\` | secrets in commits, not only in the files that are there now |
          | \`qalqon target host\` | security headers, cookie flags and TLS posture of a host you run |
          | \`qalqon templates\` | every rule that would run |

          ### Findings that fix themselves on request

          Fifty rules declare the deterministic change that ends the finding —
          the directive to flip, the line to delete, the binding to narrow.
          \`qalqon scan . -fix\` shows each one as a unified diff and writes
          nothing. With \`-apply\`, each file is backed up first, the rule is
          re-run afterwards to verify, and anything the rule still fires on is
          rolled back before the command returns.

          Windows binaries are first-class: line endings, case-insensitive file
          names and \`~\` in path arguments are all handled the way the platform
          behaves, and CI runs the full test suite on Windows runners.

          Deleting a credential in a later commit does not remove it — it is still
          in every clone — which is why \`history\` exists and reports the commit
          that introduced it.

          \`qalqon target\` takes two opt-in flags. \`-tls-versions\` asks the host
          which protocol versions it *accepts*, rather than trusting the one a
          single handshake negotiated; a server that speaks TLS 1.3 to your browser
          may still complete a TLS 1.0 handshake for anyone who asks. \`-cve\` reads
          the version a host discloses in its own headers and says what is published
          about it — with the caveat, in every finding, that a banner is a claim
          rather than a measurement, since distributions backport fixes without
          changing the version string.

          Scanning stays entirely offline. \`deps\` is the one command that makes a
          network request, because a vulnerability database changes daily and no
          useful copy of it fits in a binary.

          ### Install

          \`\`\`bash
          go install github.com/${{ github.repository }}/cmd/qalqon@$TAG
          \`\`\`

          Or download the archive for your platform below. The template library is
          compiled in, so there is nothing else to install and no network access
          is needed to scan.

          ### Verify

          \`\`\`bash
          sha256sum -c checksums.txt
          \`\`\`
          EOF

          # Two runs can race when a tag is force-updated; whichever loses
          # must refresh the winner rather than crash, and an upload after
          # an interrupted publish must resume instead of refusing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists - updating notes and re-uploading assets"
            gh release edit "$TAG" --title "Qalqon $TAG" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Qalqon $TAG" \
              --notes-file notes.md
          fi
