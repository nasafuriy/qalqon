ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www>
    Options -Indexes +FollowSymLinks
    AllowOverride None
</Directory>

<Location /server-status>
    SetHandler server-status
    Require local
</Location>

<VirtualHost *:443>
    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:!aNULL:!MD5
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
</VirtualHost>
