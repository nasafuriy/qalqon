name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Current Go, not the minimum from go.mod. Building the race-instrumented
      # test binary needs the external linker, and Go 1.22 emits a Mach-O
      # without LC_UUID that modern macOS refuses to load. The minimum version
      # is still verified, in the job below.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'
          cache: true

      - name: Vet
        run: go vet ./...

      # Job logs need a token to read through the API, so a failure here also
      # republishes the relevant lines as annotations, which stay public.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          if ! go test -race ./... 2>&1 | tee test-output.txt; then
            # One annotation carrying the whole output: filtering by pattern
            # missed the actual error last time, and annotations are capped per
            # step, so a single multi-line message is the reliable form.
            printf '::error::%s failed%%0A%%0A%s\n' \
              "${{ matrix.os }}" \
              "$(head -80 test-output.txt | awk '{printf "%s%%0A", $0}')"
            exit 1
          fi

      - name: Build
        run: go build ./cmd/qalqon

  minimum-go:
    name: Minimum supported Go (1.22)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      # No -race here: this job exists to prove the code still compiles and
      # behaves on the version go.mod claims to support, and the race detector
      # is what breaks on old toolchains.
      - name: Build and test
        run: |
          go build ./...
          go test ./...

  fixtures:
    name: Fixture behaviour
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'

      - run: go build -o qalqon ./cmd/qalqon

      # The clean tree is the false-positive guard. The step runs under -e, so
      # a single finding here fails the build, which is exactly the assertion.
      - name: Clean fixtures report nothing
        run: ./qalqon scan testdata/clean

      # The vulnerable tree must fail, or the scanner is not doing its job.
      - name: Vulnerable fixtures are caught
        run: |
          if ./qalqon scan testdata/vulnerable > /dev/null; then
            echo "::error::the vulnerable fixtures produced no findings"
            exit 1
          fi
          echo "findings reported as expected"

      - name: Templates all load
        run: ./qalqon templates

      # -list reads the manifests without contacting osv.dev, so this stays a
      # hermetic check: it proves the parsers and the command wiring work
      # without making the build depend on someone else's uptime.
      - name: Dependency manifests parse
        run: |
          ./qalqon deps . -list
          if ! ./qalqon deps . -list | grep -q 'gopkg.in/yaml.v3'; then
            echo "::error::deps -list did not report the module's own requirement"
            exit 1
          fi

      # This repository is its own fixture: the history has to be clean, and
      # the command has to work on a real one rather than only on a fabricated
      # temp repo in the unit tests. testdata is excluded for the same reason
      # the dogfood scan excludes it — those credentials are committed on
      # purpose, and reporting them would bury a real one.
      - name: History carries no secrets
        run: ./qalqon history . -exclude testdata -fail-on low

      # The TLS rules are only worth having if the probe can still reach the
      # servers they describe. Go keeps removing old versions and cipher
      # suites from what a client offers by default, and each removal has
      # silently turned a finding into "unreachable" — so pin the behaviour
      # here, against a server built for the purpose, on whatever Go the
      # runner has.
      - name: Probe reaches an obsolete TLS server
        run: go test . -run 'ObsoleteTLS|WeakCipher|StaticRSA|Sweep' -v

      # The version tables are hand-curated and go stale silently, which is the
      # worst way for a security tool to be wrong. These tests are the guard:
      # every advisory range has to be well formed, every alias has to reach a
      # table, and current releases have to produce nothing at all.
      - name: Version tables are consistent
        run: go test ./internal/service/ -v -run 'TableIsWellFormed|EveryAlias|CurrentVersions'

  dogfood:
    name: Scan this repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: 'stable'

      - run: go build -o qalqon ./cmd/qalqon

      # testdata is deliberately insecure, so it is excluded here.
      # -fail-on high keeps the low-severity "pin your actions" advisories
      # visible in the Security tab without blocking every build on them.
      - name: Scan
        run: ./qalqon scan . -exclude testdata -sarif -o qalqon.sarif -fail-on none

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: qalqon.sarif
          category: qalqon

      - name: Fail on high or above
        run: ./qalqon scan . -exclude testdata -fail-on high
