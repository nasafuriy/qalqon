# Credentials that should never reach a repository.
#
# These rules aim for high confidence over wide coverage: a secret scanner
# that cries wolf gets switched off, and then it protects nothing.

id: private-key-committed
info:
  name: Private key committed to the repository
  severity: critical
  description: >-
    A PEM private key block is present in a tracked file. Even after deletion
    it stays in git history, so the key must be treated as compromised.
  remediation: >-
    Rotate the key immediately, then remove it from history. Add the file
    pattern to .gitignore so it cannot come back.
  tags: [secret, credential, key]
files:
  - "*.pem"
  - "*.key"
  - "*.crt"
  - "*.p12"
  - "*.pfx"
  - id_rsa
  - id_dsa
  - id_ecdsa
  - id_ed25519
  - "*.env"
  - .env
  - .env.*
  - "*.yaml"
  - "*.yml"
  - "*.json"
  - "*.tf"
  - "*.sh"
  - "*.conf"
prefilter:
  - "PRIVATE KEY"
matchers:
  - type: regex
    patterns:
      - '-----BEGIN (?:RSA |DSA |EC |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'

---

id: aws-access-key-id
info:
  name: AWS access key id in source
  severity: critical
  description: >-
    An AKIA or ASIA identifier is a real AWS access key. Paired with the
    secret it grants whatever the key's policy allows, and scanners sweeping
    public repositories find these within minutes of a push.
  remediation: >-
    Disable the key in IAM now, then rotate it. Use instance roles, OIDC or a
    secret manager instead of long-lived keys in files.
  reference:
    - https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_access-keys.html
  tags: [secret, credential, aws, cloud]
files:
  - "*.env"
  - .env
  - .env.*
  - "*.yaml"
  - "*.yml"
  - "*.json"
  - "*.tf"
  - "*.tfvars"
  - "*.sh"
  - "*.conf"
  - "*.ini"
  - "*.properties"
  - "*.py"
  - "*.js"
  - "*.ts"
  - "*.go"
  - "*.rb"
  - "*.java"
  - "*.php"
  - Dockerfile
  - docker-compose.yml
  - docker-compose.yaml
prefilter: [AKIA, ASIA, AGPA, AIDA, AROA, ANPA]
matchers:
  - type: regex
    patterns:
      - '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|ANPA)[0-9A-Z]{16}\b'

---

id: provider-token-committed
info:
  name: Service provider token in source
  severity: critical
  description: >-
    A token matching a known provider format was found. These prefixes are
    unambiguous, so this is almost never a false positive.
  remediation: Revoke the token at the provider, then rotate it and move it into a secret store.
  tags: [secret, credential, token]
files:
  - "*.env"
  - .env
  - .env.*
  - "*.yaml"
  - "*.yml"
  - "*.json"
  - "*.tf"
  - "*.tfvars"
  - "*.sh"
  - "*.conf"
  - "*.ini"
  - "*.py"
  - "*.js"
  - "*.ts"
  - "*.go"
  - "*.rb"
  - "*.php"
  - "*.md"
  - Dockerfile
prefilter: [ghp_, gho_, ghu_, ghs_, ghr_, xox, "sk-", AIza, "SG."]
matchers:
  - type: regex
    patterns:
      - '\bgh[pousr]_[A-Za-z0-9]{36}\b'
      - '\bxox[baprs]-[0-9A-Za-z-]{10,}'
      - '\bsk-[A-Za-z0-9]{20,}\b'
      - '\bAIza[0-9A-Za-z_-]{35}\b'
      - '\bSG\.[A-Za-z0-9_-]{22}\.[A-Za-z0-9_-]{43}\b'

---

id: hardcoded-credential-assignment
info:
  name: Credential assigned a literal value
  severity: high
  description: >-
    A variable whose name says it holds a secret is assigned a long literal
    rather than a reference to configuration. Values starting with $ or { are
    ignored, so environment lookups do not fire this rule.
  remediation: >-
    Read the value from the environment or a secret manager. If this is a
    placeholder in an example file, shorten it or use an obvious dummy value.
  tags: [secret, credential]
files:
  - "*.env"
  - .env
  - .env.*
  - "*.py"
  - "*.js"
  - "*.ts"
  - "*.go"
  - "*.rb"
  - "*.java"
  - "*.php"
  - "*.cs"
  - "*.ini"
  - "*.properties"
  - "*.conf"
  - "*.tf"
  - "*.tfvars"
exclude:
  - "*.example"
  - "*.sample"
  - .env.example
  - .env.sample
  - "*_test.go"
  - "*.test.js"
  - "*.spec.ts"
prefilter:
  - KEY
  - Key
  - key
  - TOKEN
  - Token
  - token
  - SECRET
  - Secret
  - secret
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*(?:export\s+)?[A-Za-z0-9_]*(?:API_?KEY|SECRET_?KEY|ACCESS_?TOKEN|AUTH_?TOKEN|CLIENT_?SECRET|PRIVATE_?TOKEN)[A-Za-z0-9_]*\s*[:=]\s*["'']?[A-Za-z0-9_+/=-]{16,}'

---

id: connection-string-with-password
info:
  name: Database URL carries an inline password
  severity: high
  description: >-
    A connection string with the password in it lands in logs, in error
    pages, in process listings and in whatever monitoring reads the
    configuration. The credential travels everywhere the URL does.
  remediation: >-
    Keep the password in a separate secret and assemble the URL at run time,
    or use the driver's dedicated password parameter.
  tags: [secret, credential, database]
files:
  - "*.env"
  - .env
  - .env.*
  - "*.yaml"
  - "*.yml"
  - "*.json"
  - "*.tf"
  - "*.tfvars"
  - "*.sh"
  - "*.conf"
  - "*.ini"
  - "*.properties"
  - "*.py"
  - "*.js"
  - "*.ts"
  - "*.go"
  - "*.rb"
  - "*.php"
exclude:
  - "*.example"
  - "*.sample"
  - .env.example
  - .env.sample
prefilter:
  - "postgres://"
  - "postgresql://"
  - "mysql://"
  - "mongodb://"
  - "mongodb+srv://"
  - "redis://"
  - "amqp://"
matchers:
  - type: regex
    comment: a password beginning with $ or { is a reference being interpolated
    patterns:
      - '(?i)\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp)://[A-Za-z0-9._%+-]+:[^\s:@/${"''][^\s@/]{2,}@'

---

id: gcp-service-account-key
info:
  name: GCP service account key file committed
  severity: critical
  description: >-
    A service_account JSON key is a long-lived credential that GCP will not
    expire on its own. Anyone holding the file authenticates as that account
    until someone notices and deletes the key.
  remediation: >-
    Delete the key in IAM, then move to Workload Identity Federation so no
    long-lived key exists at all.
  reference:
    - https://cloud.google.com/iam/docs/workload-identity-federation
  tags: [secret, credential, gcp, cloud, key]
files:
  - "*.json"
  - "*.yaml"
  - "*.yml"
  - "*.env"
  - .env
  - .env.*
exclude:
  - "*.example"
  - "*.sample"
prefilter: [service_account]
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?i)"type"\s*:\s*"service_account"'
  - type: regex
    patterns:
      - '(?i)"private_key_id"\s*:\s*"[a-f0-9]{40}"'
      - '(?i)"private_key"\s*:\s*"-----BEGIN'

---

id: slack-webhook-committed
info:
  name: Slack webhook URL committed
  severity: high
  description: >-
    A Slack incoming webhook needs no other authentication — the URL is the
    credential. Anyone who finds it can post into that channel as the app,
    which is enough for convincing internal phishing.
  remediation: Revoke the webhook in the Slack app configuration and issue a new one from a secret store.
  tags: [secret, credential, slack]
files:
  - "*.env"
  - .env
  - .env.*
  - "*.yaml"
  - "*.yml"
  - "*.json"
  - "*.tf"
  - "*.sh"
  - "*.conf"
  - "*.py"
  - "*.js"
  - "*.ts"
  - "*.go"
  - "*.rb"
  - "*.php"
  - "*.md"
exclude:
  - "*.example"
  - "*.sample"
prefilter: ["hooks.slack.com"]
matchers:
  - type: regex
    patterns:
      - 'https://hooks\.slack\.com/services/T[A-Za-z0-9]{6,}/B[A-Za-z0-9]{6,}/[A-Za-z0-9]{20,}'

---

id: stripe-live-key
info:
  name: Stripe live secret key committed
  severity: critical
  description: >-
    An sk_live or rk_live key operates against real money. It can read the
    customer list, issue refunds and create charges, and the prefix makes it
    unmistakable to anyone scanning for it.
  remediation: Roll the key in the Stripe dashboard immediately, then check the API logs for use you do not recognise.
  reference:
    - https://stripe.com/docs/keys
  tags: [secret, credential, stripe, payment]
files:
  - "*.env"
  - .env
  - .env.*
  - "*.yaml"
  - "*.yml"
  - "*.json"
  - "*.tf"
  - "*.sh"
  - "*.conf"
  - "*.ini"
  - "*.py"
  - "*.js"
  - "*.ts"
  - "*.go"
  - "*.rb"
  - "*.php"
  - "*.md"
exclude:
  - "*.example"
  - "*.sample"
prefilter: [sk_live_, rk_live_]
matchers:
  - type: regex
    patterns:
      - '\b(?:sk|rk)_live_[0-9a-zA-Z]{24,}\b'

---

id: jwt-token-committed
info:
  name: JSON Web Token committed
  severity: medium
  description: >-
    A JWT in a tracked file is a bearer credential: whoever holds it is the
    subject it names until it expires, and plenty are issued with no
    expiry at all. The payload is only base64, so it is readable as well.
  remediation: >-
    Treat the token as compromised and rotate the signing key if it cannot be
    revoked individually. Obtain tokens at run time rather than storing them.
  tags: [secret, credential, token, jwt]
files:
  - "*.env"
  - .env
  - .env.*
  - "*.yaml"
  - "*.yml"
  - "*.json"
  - "*.conf"
  - "*.ini"
  - "*.py"
  - "*.js"
  - "*.ts"
  - "*.go"
  - "*.rb"
  - "*.php"
  - "*.md"
exclude:
  - "*.example"
  - "*.sample"
  - "*_test.go"
  - "*.test.js"
  - "*.spec.ts"
prefilter: ["eyJ"]
matchers:
  - type: regex
    comment: header.payload.signature, both first segments being base64url of a JSON object
    patterns:
      - '\beyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'

---

id: env-file-committed
info:
  name: Environment file tracked in the repository
  severity: medium
  description: >-
    A .env file usually holds the credentials the application needs to run.
    Once committed it is in every clone and in history forever.
  remediation: >-
    Add .env to .gitignore, keep a .env.example with dummy values, and rotate
    anything the committed file exposed.
  tags: [secret, hygiene]
files:
  - .env
  - .env.local
  - .env.production
  - .env.prod
exclude:
  - .env.example
  - .env.sample
  - .env.template
once: true
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*[A-Za-z_][A-Za-z0-9_]*\s*='
