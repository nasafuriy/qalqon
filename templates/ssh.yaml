# OpenSSH server configuration.
#
# Directives are matched at the start of a line so commented-out examples in
# the shipped sshd_config do not count.

id: sshd-permit-root-login
info:
  name: Root can log in over SSH
  severity: high
  description: >-
    PermitRootLogin yes lets an attacker aim every guess at a single account
    that exists on every machine and already has full privileges. It also
    destroys attribution, because every action is logged as root.
  remediation: >-
    Set "PermitRootLogin no" and log in as a normal user, escalating with sudo.
    If automation needs root, "prohibit-password" with a key is the compromise.
  reference:
    - https://man.openbsd.org/sshd_config
  tags: [ssh, sshd, privilege, hardening]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*PermitRootLogin\s+(?:yes|without-password)\b'

---

id: sshd-password-authentication
info:
  name: Password authentication enabled
  severity: medium
  description: >-
    Passwords can be guessed, and an internet-facing SSH port sees continuous
    automated attempts. Public keys remove that entire class of attack.
  remediation: >-
    Set "PasswordAuthentication no" and "KbdInteractiveAuthentication no" once
    every user has a key installed — check before you disconnect.
  tags: [ssh, sshd, authentication]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*PasswordAuthentication\s+yes\b'

---

id: sshd-empty-passwords
info:
  name: Empty passwords accepted
  severity: critical
  description: >-
    PermitEmptyPasswords yes allows login to any account whose password field
    is blank, with no credential at all.
  remediation: Set "PermitEmptyPasswords no".
  tags: [ssh, sshd, authentication]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*PermitEmptyPasswords\s+yes\b'

---

id: sshd-x11-forwarding
info:
  name: X11 forwarding enabled
  severity: low
  description: >-
    X11 forwarding lets a compromised server reach back into the client's
    display and read its input. It is rarely needed on a server.
  remediation: Set "X11Forwarding no" unless a specific workflow depends on it.
  tags: [ssh, sshd, hardening]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*X11Forwarding\s+yes\b'

---

id: sshd-weak-ciphers
info:
  name: Obsolete SSH ciphers or MACs enabled
  severity: high
  description: >-
    CBC-mode ciphers, arcfour, 3DES and MD5 or 96-bit truncated MACs all have
    known weaknesses and were removed from OpenSSH defaults years ago.
    Re-enabling them only helps an attacker who can downgrade the connection.
  remediation: >-
    Remove the explicit list and use the modern defaults, or specify only
    chacha20-poly1305, aes256-gcm and aes128-gcm.
  reference:
    - https://www.openssh.com/legacy.html
  tags: [ssh, sshd, crypto]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
  - ssh_config
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*Ciphers[^\n]*(?:arcfour|3des|-cbc)'
      - '(?im)^\s*MACs[^\n]*(?:hmac-md5|-96\b)'

---

id: sshd-protocol-1
info:
  name: SSH protocol 1 enabled
  severity: critical
  description: >-
    SSH protocol version 1 is cryptographically broken and was removed from
    OpenSSH entirely. A configuration still requesting it indicates a very old
    or hand-written file.
  remediation: Remove the Protocol directive; modern OpenSSH speaks version 2 only.
  tags: [ssh, sshd, crypto, legacy]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*Protocol\s+.*\b1\b'

---

id: sshd-permit-user-environment
info:
  name: Users may set environment variables at login
  severity: medium
  description: >-
    PermitUserEnvironment lets a user's ~/.ssh/environment set variables for
    the login shell. LD_PRELOAD and PATH are enough to turn write access to a
    home directory into code execution under whatever the session later runs.
  remediation: Set "PermitUserEnvironment no", which is the default.
  reference:
    - https://man.openbsd.org/sshd_config
  tags: [ssh, sshd, privilege]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*PermitUserEnvironment\s+yes\b'

---

id: sshd-strict-modes-disabled
info:
  name: sshd no longer checks key file permissions
  severity: medium
  description: >-
    StrictModes is the check that refuses to use an authorized_keys file that
    is group- or world-writable. Turning it off means anyone who can write to
    another user's home directory can add their own key to it.
  remediation: Set "StrictModes yes", which is the default.
  tags: [ssh, sshd, permissions]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*StrictModes\s+no\b'

---

id: sshd-gateway-ports
info:
  name: Remote forwarded ports exposed beyond the server
  severity: medium
  description: >-
    GatewayPorts lets a client's remote forward bind to every interface rather
    than loopback, so any user with SSH access can publish an internal service
    on the host's public address without touching the firewall.
  remediation: Set "GatewayPorts no", and use "clientspecified" only where a specific workflow requires it.
  tags: [ssh, sshd, network, exposure]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*GatewayPorts\s+(?:yes|clientspecified)\b'

---

id: sshd-agent-forwarding
info:
  name: SSH agent forwarding enabled
  severity: low
  description: >-
    A forwarded agent socket can be used by anyone with root on the
    intermediate host to authenticate as the connecting user anywhere their
    key is accepted. The key never leaves the laptop, but its use does not
    stay there either.
  remediation: >-
    Set "AllowAgentForwarding no" and use ProxyJump, which keeps the
    authentication on the client.
  tags: [ssh, sshd, credential]
files:
  - sshd_config
  - sshd_config.d/*.conf
  - "*/sshd_config"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*AllowAgentForwarding\s+yes\b'
