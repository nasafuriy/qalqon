global
    ssl-default-bind-options ssl-min-ver TLSv1.2

frontend web
    bind :443 ssl crt /etc/ssl/site.pem
    http-request set-header X-Forwarded-Proto https
    default_backend app

backend app
    server app1 10.0.0.5:8443 ssl verify required ca-file /etc/ssl/internal-ca.pem

listen stats
    bind 127.0.0.1:8404
    stats enable
    stats uri /haproxy
    stats auth admin:${STATS_PASSWORD}
