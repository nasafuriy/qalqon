# Terraform and OpenTofu rules.

id: terraform-security-group-open-to-world
info:
  name: Security group open to the whole internet
  severity: high
  description: >-
    An ingress rule with 0.0.0.0/0 exposes the port to every host on the
    internet. On an administrative port such as 22, 3389, 3306 or 6379 this is
    how instances get compromised within hours of being created.
  remediation: >-
    Restrict cidr_blocks to the ranges that need access, or put the workload
    behind a load balancer or bastion.
  reference:
    - https://registry.terraform.io/providers/hashicorp/aws/latest/docs/resources/security_group
  tags: [terraform, aws, network, exposure]
files:
  - "*.tf"
prefilter: ["0.0.0.0/0", "::/0"]
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?is)resource\s+"[a-z_]*security_group'
  - type: regex
    patterns:
      - '(?im)^\s*cidr_blocks\s*=\s*\[[^\]]*"0\.0\.0\.0/0"'
      - '(?im)^\s*ipv6_cidr_blocks\s*=\s*\[[^\]]*"::/0"'

---

id: terraform-public-storage-bucket
info:
  name: Storage bucket granted public access
  severity: critical
  description: >-
    A public-read ACL makes every object in the bucket readable by anyone who
    learns the URL. Publicly exposed buckets remain one of the most common
    causes of large data leaks.
  remediation: >-
    Remove the public ACL and serve objects through a CDN with signed URLs.
    On AWS also enable the account-level public access block.
  tags: [terraform, aws, storage, exposure]
files:
  - "*.tf"
prefilter: [public-read, public-read-write, allUsers]
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*acl\s*=\s*"public-read(?:-write)?"'
      - '(?im)"allUsers"'

---

id: terraform-hardcoded-credential
info:
  name: Credential written into Terraform source
  severity: critical
  description: >-
    A literal secret in a .tf file is committed to version control and copied
    into every clone. Terraform also writes provider credentials into state,
    so this usually means the state file is sensitive too.
  remediation: >-
    Use variables fed from the environment, or a secret manager data source.
    Never place a credential in a committed .tf file.
  tags: [terraform, secret, credential]
files:
  - "*.tf"
matchers:
  - type: regex
    comment: values starting with var. or a $ reference are not literals
    patterns:
      - '(?im)^\s*(?:access_key|secret_key|password|token|client_secret|private_key)\s*=\s*"[^"${][^"]{7,}"'

---

id: terraform-unencrypted-storage
info:
  name: Storage created without encryption at rest
  severity: medium
  description: >-
    Encryption at rest is a single line of configuration and protects against
    disk-level exposure, snapshot sharing and backup theft. Leaving it off is
    almost never a deliberate trade-off.
  remediation: Set encrypted = true, or attach the provider's encryption configuration block.
  tags: [terraform, aws, encryption, storage]
files:
  - "*.tf"
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?is)resource\s+"aws_(?:ebs_volume|rds_cluster|db_instance)"'
  - type: absent
    patterns:
      - '(?im)^\s*(?:storage_)?encrypted\s*=\s*true'

---

id: terraform-plaintext-state-backend
info:
  name: Remote state backend without encryption
  severity: medium
  description: >-
    Terraform state contains every attribute of every resource, including
    generated passwords and keys. An unencrypted backend leaves all of it
    readable to anyone with bucket access.
  remediation: Set encrypt = true on the S3 backend, and restrict who can read the bucket.
  reference:
    - https://developer.hashicorp.com/terraform/language/settings/backends/s3
  tags: [terraform, state, encryption]
files:
  - "*.tf"
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?is)backend\s+"s3"\s*\{'
  - type: absent
    patterns:
      - '(?im)^\s*encrypt\s*=\s*true'

---

id: terraform-database-publicly-accessible
info:
  name: Managed database given a public address
  severity: high
  description: >-
    publicly_accessible puts the instance on a routable address, so the only
    thing between the internet and the data is the security group and the
    database password. Credential stuffing against 3306 and 5432 is constant.
  remediation: >-
    Leave publicly_accessible false and reach the database from inside the
    VPC, over a bastion, or through a VPN.
  tags: [terraform, aws, database, exposure]
files:
  - "*.tf"
matchers:
  - type: regex
    patterns:
      - '(?im)^\s*publicly_accessible\s*=\s*true\b'

---

id: terraform-gcp-firewall-open-to-world
info:
  name: GCP firewall rule open to the whole internet
  severity: high
  description: >-
    source_ranges 0.0.0.0/0 allows every host on the internet to reach the
    ports the rule opens. On a management port this is how instances are found
    and compromised by automated scanning.
  remediation: >-
    Narrow source_ranges to the networks that need access, or use
    source_tags and source_service_accounts to scope the rule to workloads.
  reference:
    - https://registry.terraform.io/providers/hashicorp/google/latest/docs/resources/compute_firewall
  tags: [terraform, gcp, cloud, network, exposure]
files:
  - "*.tf"
prefilter: ["0.0.0.0/0"]
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?is)resource\s+"google_compute_firewall"'
  - type: regex
    patterns:
      - '(?im)^\s*source_ranges\s*=\s*\[[^\]]*"0\.0\.0\.0/0"'

---

id: terraform-azure-network-open-to-world
info:
  name: Azure security rule open to the whole internet
  severity: high
  description: >-
    A source_address_prefix of "*" or "Internet" on an inbound Allow rule
    exposes the ports to every host on the internet, which defeats the network
    security group it is written in.
  remediation: >-
    Name the specific address prefixes, or reference another security group
    with source_application_security_group_ids.
  reference:
    - https://registry.terraform.io/providers/hashicorp/azurerm/latest/docs/resources/network_security_rule
  tags: [terraform, azure, cloud, network, exposure]
files:
  - "*.tf"
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?is)resource\s+"azurerm_network_security_(?:rule|group)"'
  - type: regex
    context: true
    patterns:
      - '(?im)^\s*direction\s*=\s*"Inbound"'
  - type: regex
    patterns:
      - '(?im)^\s*source_address_prefix\s*=\s*"(?:\*|Internet)"'

---

id: terraform-azure-insecure-transfer
info:
  name: Azure storage account allows plaintext or obsolete TLS
  severity: medium
  description: >-
    Turning off https_traffic_only lets clients read and write blobs over
    plain HTTP, and a min_tls_version of TLS1_0 or TLS1_1 keeps protocol
    versions alive that carry known weaknesses.
  remediation: >-
    Leave https_traffic_only enabled and set min_tls_version to TLS1_2.
  tags: [terraform, azure, cloud, storage, tls]
files:
  - "*.tf"
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?is)resource\s+"azurerm_storage_account"'
  - type: regex
    patterns:
      - '(?im)^\s*(?:enable_https_traffic_only|https_traffic_only_enabled)\s*=\s*false\b'
      - '(?im)^\s*min_tls_version\s*=\s*"TLS1_[01]"'

---

id: terraform-module-source-unpinned
info:
  name: Git module source is not pinned to a revision
  severity: medium
  description: >-
    A git source with no ref resolves to the default branch every time
    terraform init runs, so the same committed configuration can produce two
    different plans on two different days.
  remediation: 'Append a revision: source = "git::https://…//module?ref=v1.4.0".'
  reference:
    - https://developer.hashicorp.com/terraform/language/modules/sources
  tags: [terraform, supply-chain]
files:
  - "*.tf"
prefilter: ["git::"]
matchers:
  - type: regex
    comment: >-
      a source with no query string at all cannot carry ?ref=. RE2 has no
      lookahead, so this deliberately says nothing about sources that do have
      a query string — missing a case beats inventing one.
    patterns:
      - '(?im)^\s*source\s*=\s*"git::[^"?\n]*"'

---

id: terraform-iam-wildcard-policy
info:
  name: IAM policy grants every action
  severity: high
  description: >-
    An policy statement with Action "*" on Resource "*" grants full control of
    the account. Any credential holding it becomes a total compromise.
  remediation: List the specific actions and resources the principal needs.
  tags: [terraform, aws, iam, least-privilege]
files:
  - "*.tf"
  - "*.tf.json"
  - "*.json"
prefilter: [Action, action, ACTION]
condition: and
matchers:
  - type: regex
    context: true
    patterns:
      - '(?i)"?Effect"?\s*[:=]\s*"Allow"'
  - type: regex
    patterns:
      - '(?i)"?Action"?\s*[:=]\s*(?:\[\s*)?"\*"'
